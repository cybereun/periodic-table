<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>원소 주기율표</title>
<style>
:root {
  --bg: #f6f7f9; --fg: #16181d; --muted: #5d6471; --card: #ffffff; --line: #d9dde3;
  --ts: 70%; --tl: 88%; --tb: 42%; --lo: 94%; --hi: 52%;
  --focus: #1a5fd0;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12141a; --fg: #eceef2; --muted: #a0a7b4; --card: #1b1e26; --line: #2f3440;
    --ts: 40%; --tl: 24%; --tb: 62%; --lo: 18%; --hi: 48%; --focus: #7aa7ff;
  }
}
:root[data-theme="dark"] {
  --bg: #12141a; --fg: #eceef2; --muted: #a0a7b4; --card: #1b1e26; --line: #2f3440;
  --ts: 40%; --tl: 24%; --tb: 62%; --lo: 18%; --hi: 48%; --focus: #7aa7ff;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
}
header {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  max-width: 1600px; margin: 0 auto; padding: 16px 16px 4px;
}
h1 { margin: 0; font-size: clamp(20px, 2.2vw, 34px); letter-spacing: -0.02em; }
header p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
#theme {
  border: 1px solid var(--line); background: var(--card); color: var(--fg);
  border-radius: 999px; padding: 8px 14px; font: inherit; font-size: 14px; cursor: pointer;
}
.scroll { overflow-x: auto; padding: 8px 16px 24px; }
.wrap { max-width: 1600px; margin: 0 auto; min-width: 780px; container-type: inline-size; }
.table {
  display: grid; gap: 0.35cqw;
  grid-template-columns: repeat(18, 1fr);
  grid-template-rows: auto repeat(7, auto) 1.2cqw auto auto;
}
.gl { text-align: center; color: var(--muted); font-size: max(10px, 0.8cqw); }
.el, .ph {
  position: relative; aspect-ratio: 1 / 1.1; min-width: 0;
  border-radius: 0.5cqw; text-align: center;
}
.el {
  --h: 0;
  background: hsl(var(--h) var(--ts) var(--tl));
  border: 1px solid hsl(var(--h) 50% var(--tb) / 0.55);
  color: var(--fg); font: inherit; padding: max(11px, 1.3cqw) 0 0; cursor: pointer; overflow: hidden;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  transition: transform .12s, box-shadow .12s, opacity .15s;
}
.el:hover { transform: scale(1.12); z-index: 3; box-shadow: 0 6px 18px rgb(0 0 0 / .25); }
.el:focus-visible { outline: 3px solid var(--focus); outline-offset: 1px; z-index: 4; }
.el[aria-pressed="true"] { outline: 3px solid var(--fg); z-index: 4; transform: scale(1.12); }
.el .n { position: absolute; top: 4%; left: 8%; font-size: max(8px, 0.75cqw); line-height: 1; opacity: .8; }
.el .s { font-size: max(13px, 1.9cqw); font-weight: 700; line-height: 1; }
@container (max-width: 1100px) { .el .m { display: none; } }
.el .k { font-size: max(8px, 0.8cqw); margin-top: 3%; }
.el .m { font-size: max(7px, 0.62cqw); opacity: .7; margin-top: 2%; }
.ph {
  border: 1px dashed var(--line); color: var(--muted);
  display: flex; align-items: center; justify-content: center; font-size: max(9px, 0.8cqw);
}
.el.dim { opacity: .14; }
.rowlabel {
  align-self: center; justify-self: end; color: var(--muted);
  font-size: max(9px, 0.75cqw); padding-right: 4px; text-align: right;
}

.panel {
  grid-column: 3 / 13; grid-row: 2 / 5; margin: 0 0.6cqw 0.4cqw;
  background: var(--card); border: 1px solid var(--line); border-radius: 1cqw;
  padding: 1cqw 1.6cqw; display: flex; align-items: center; gap: 2cqw; min-width: 0;
  contain: size; overflow: auto;
}
.panel .hint { margin: 0 auto; text-align: center; }
.panel .hint b { display: block; font-size: max(18px, 2.4cqw); letter-spacing: -0.02em; }
.panel .hint span { color: var(--muted); font-size: max(11px, 1cqw); }
.big {
  --h: 0;
  flex: none; width: 9cqw; aspect-ratio: 1; border-radius: 1cqw;
  background: hsl(var(--h) var(--ts) var(--tl)); border: 2px solid hsl(var(--h) 50% var(--tb));
  display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative;
}
.big .n { position: absolute; top: 6%; left: 8%; font-size: max(11px, 1.1cqw); }
.big .s { font-size: max(32px, 5cqw); font-weight: 800; line-height: 1; }
.big .m { font-size: max(10px, 1cqw); opacity: .75; margin-top: 4%; }
.info { min-width: 0; flex: 1; }
.info h2 { margin: 0; font-size: max(20px, 2.5cqw); letter-spacing: -0.02em; }
.info h2 small { font-size: .55em; color: var(--muted); font-weight: 500; margin-left: .5em; }
.info dl {
  display: grid; grid-template-columns: auto 1fr auto 1fr; gap: 0.5cqw 1.2cqw;
  margin: 0.8cqw 0 0; font-size: max(11px, 1.05cqw);
}
.info dt { color: var(--muted); }
.info dd { margin: 0; font-weight: 600; }
.info dd.wide { grid-column: span 3; }
sup { font-size: .7em; line-height: 0; }

.legend { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 1.4cqw; }
.legend button {
  --h: 0; display: inline-flex; align-items: center; gap: 8px;
  border: 1px solid var(--line); background: var(--card); color: var(--fg);
  border-radius: 999px; padding: 6px 12px; font: inherit; font-size: max(12px, 1cqw); cursor: pointer;
}
.legend button i {
  width: 14px; height: 14px; border-radius: 4px; display: inline-block;
  background: hsl(var(--h) var(--ts) var(--tl)); border: 1px solid hsl(var(--h) 50% var(--tb));
}
.legend button[aria-pressed="true"] { outline: 2px solid var(--fg); }
.legend button:focus-visible { outline: 3px solid var(--focus); }
.legend .note { width: 100%; text-align: center; color: var(--muted); font-size: max(11px, .85cqw); }

.toolbar {
  display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
  max-width: 1600px; margin: 0 auto; padding: 8px 16px 0;
}
.toolbar input, .toolbar select {
  border: 1px solid var(--line); background: var(--card); color: var(--fg);
  border-radius: 10px; padding: 9px 12px; font: inherit; font-size: 14px;
}
.toolbar input { flex: 1 1 260px; max-width: 420px; }
.toolbar label { color: var(--muted); font-size: 14px; display: flex; align-items: center; gap: 8px; }
.toolbar input:focus-visible, .toolbar select:focus-visible { outline: 3px solid var(--focus); }
.scale { display: flex; align-items: center; gap: 10px; font-size: max(12px, 1cqw); flex-wrap: wrap; justify-content: center; }
.scale .bar {
  --h: 0; width: 24cqw; height: 14px; border-radius: 7px; border: 1px solid var(--line);
  background: linear-gradient(90deg, hsl(var(--h) 75% var(--lo)), hsl(var(--h) 75% var(--hi)));
}
.scale em { color: var(--muted); font-style: normal; }
.btn {
  border: 1px solid var(--line); background: var(--card); color: var(--fg);
  border-radius: 10px; padding: 9px 14px; font: inherit; font-size: 14px; cursor: pointer;
}
.btn[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.btn:focus-visible { outline: 3px solid var(--focus); }
.toolbar [hidden] { display: none; }
.el.out { opacity: .12; pointer-events: none; }
.table.h-k .el .k, .table.h-s .el .s, .table.h-n .el .n { visibility: hidden; }
.el.right { background: hsl(140 60% 42%) !important; color: #fff; outline: 3px solid hsl(140 70% 25%); z-index: 4; transform: scale(1.12); }
.el.wrong { background: hsl(0 70% 52%) !important; color: #fff; animation: shake .4s; }
@keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
.qbox { margin: 0 auto; text-align: center; width: 100%; }
.qbox .qh { color: var(--muted); font-size: max(11px, 1cqw); }
.qbox .qq { font-size: max(18px, 2.2cqw); font-weight: 700; margin: .6cqw 0; letter-spacing: -0.02em; }
.qbox .qq b { color: hsl(215 70% 45%); }
.qbox .qf { min-height: 1.6em; font-size: max(12px, 1.1cqw); }
.qbox .qb { display: flex; gap: 8px; justify-content: center; margin-top: .6cqw; }
@media (max-width: 780px) { header { padding-top: 12px; } }
@media (prefers-reduced-motion: reduce) { .el { transition: none; } }
</style>
</head>
<body>
<header>
  <div>
    <h1>원소 주기율표</h1>
    <p>원소를 클릭하거나 방향키로 이동하세요 · Esc로 선택 해제</p>
  </div>
  <button id="theme" type="button" aria-label="화면 테마 전환">🌓 테마</button>
</header>

<div class="toolbar">
  <input id="search" type="search" placeholder="검색: 이름, 기호, 원자번호 (예: 철, Fe, 26)" aria-label="원소 검색" autocomplete="off">
  <label>색상 기준
    <select id="mode">
      <option value="cat">분류</option>
      <option value="state">상태 (25°C)</option>
      <option value="eneg">전기음성도</option>
      <option value="mass">원자량</option>
    </select>
  </label>
  <button id="quizBtn" class="btn" type="button" aria-pressed="false">🎯 퀴즈</button>
  <label id="qrangeWrap" hidden>범위
    <select id="qrange">
      <option value="20">1–20번</option>
      <option value="36">1–36번</option>
      <option value="54">1–54번</option>
      <option value="118">전체</option>
    </select>
  </label>
  <button id="fitBtn" class="btn" type="button" aria-pressed="true">한 화면 맞춤</button>
  <button id="fsBtn" class="btn" type="button">전체화면</button>
</div>

<div class="scroll">
  <div class="wrap">
    <div class="table" id="table"></div>
    <div class="legend" id="legend"></div>
  </div>
</div>

function place(n) {
  if (n === 1) return { col: 1, row: 1 };
  if (n === 2) return { col: 18, row: 1 };
  const bounds = [[3,2],[11,3],[19,4],[37,5],[55,6],[87,7]];
  let start = 3, period = 2;
  for (const [s, p] of bounds) if (n >= s) { start = s; period = p; }
  const idx = n - start;
  if (period <= 3) return { col: idx < 2 ? idx + 1 : idx + 11, row: period };
  if (period <= 5) return { col: idx + 1, row: period };
  if (idx < 2) return { col: idx + 1, row: period };
  if (n >= 57 && n <= 71) return { col: n - 57 + 3, row: 9 };
  if (n >= 89 && n <= 103) return { col: n - 89 + 3, row: 10 };
  return { col: idx - 13, row: period };
}

      if (v == null) gray = true;
      else tl = `calc(var(--lo) + (var(--hi) - var(--lo)) * ${Math.min(1, Math.max(0, s.t(v))).toFixed(3)})`;
    }
    t.dataset.key = key || '';
    t.style.setProperty('--h', h);
    t.style.setProperty('--ts', gray ? '0%' : mode === 'cat' || mode === 'state' ? '' : '75%');
    if (!t.style.getPropertyValue('--ts')) t.style.removeProperty('--ts');
    if (tl) t.style.setProperty('--tl', tl); else t.style.removeProperty('--tl');
  }
  buildLegend();
  applyFilter();
  applyFit();
}

function buildLegend() {
  legend.innerHTML = '';
  legendKey = null;
  if (mode === 'cat' || mode === 'state') {
    const items = mode === 'cat'
      ? Object.entries(CAT).map(([k, [l, h]]) => [k, l, h])
      : Object.entries(STATE).map(([k, l]) => [k, l, STATE_HUE[k]]);
    for (const [key, label, h] of items) {
      const b = document.createElement('button');
      b.type = 'button'; b.setAttribute('aria-pressed', 'false');
      b.style.setProperty('--h', h);
      if (key === 'unknown') b.style.setProperty('--ts', '0%');
      b.innerHTML = `<i></i>${label}`;
      b.addEventListener('click', () => {
        legendKey = legendKey === key ? null : key;
        legend.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', 'false'));
        if (legendKey) b.setAttribute('aria-pressed', 'true');
        applyFilter();
      });
      legend.appendChild(b);
    }
  } else {
    const s = SCALES[mode];
    const bar = document.createElement('div');
    bar.className = 'scale';
    bar.style.setProperty('--h', s.hue);
    bar.innerHTML = `<span>${s.min}</span><div class="bar"></div><span>${s.max}</span><em>${s.label}${mode === 'mass' ? ' (제곱근 눈금)' : ''} · 회색은 값 없음</em>`;
    legend.appendChild(bar);
  }
  const note = document.createElement('div');
  note.className = 'note';
  note.textContent = '[ ] 안의 값은 안정 동위원소가 없는 원소의 대표 질량수 · 109번 이후 원소의 성질은 예측값 · 전기음성도는 폴링 값';
  legend.appendChild(note);
}

function applyFilter() {
  const q = search.value.trim().toLowerCase();
  tiles.forEach(t => {
    const e = D[+t.dataset.n - 1];
    const okQ = !q || String(e[0]) === q || e[1].toLowerCase().startsWith(q) ||
                e[2].includes(q) || e[3].toLowerCase().includes(q);
    const okL = !legendKey || t.dataset.key === legendKey;
    t.classList.toggle('dim', !(okQ && okL));
  });
}
search.addEventListener('input', applyFilter);
search.addEventListener('keydown', ev => {
  if (ev.key === 'Enter') {
    const first = [...tiles.values()].find(t => !t.classList.contains('dim'));
    if (first && search.value.trim()) { first.focus(); select(+first.dataset.n); }
  } else if (ev.key === 'Escape') { search.value = ''; applyFilter(); }
  ev.stopPropagation();
});
modeSel.addEventListener('change', () => { mode = modeSel.value; paint(); });
paint();

// ---- 한 화면 맞춤 ----
function applyFit() {
  wrap.style.width = '';
  if (!fitOn) return;
  window.scrollTo(0, 0);
  for (let i = 0; i < 3; i++) {
    const r = wrap.getBoundingClientRect();
    const availH = innerHeight - r.top - 40;
    if (Math.abs(r.height - availH) < 2 || (r.height < availH && i === 0)) break;
    wrap.style.width = Math.max(780, Math.floor(r.width * availH / r.height)) + 'px';
  }
}
document.getElementById('fitBtn').addEventListener('click', ev => {
  fitOn = !fitOn;
  ev.currentTarget.setAttribute('aria-pressed', String(fitOn));
  applyFit();
});
document.getElementById('fsBtn').addEventListener('click', () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
});
addEventListener('resize', applyFit);

// ---- 퀴즈 ----
const quizBtn = document.getElementById('quizBtn');
const qrange = document.getElementById('qrange');
const qrangeWrap = document.getElementById('qrangeWrap');
let qTimer = null;
const TOTAL_Q = 10;

function setHide(h) {
  table.classList.remove('h-k', 'h-s', 'h-n');
  h.forEach(x => table.classList.add('h-' + x));
}
function clearMarks() { tiles.forEach(t => t.classList.remove('right', 'wrong')); }
function startQuiz() {
  clearTimeout(qTimer);
  if (selected) tiles.get(place(selected).col + ',' + place(selected).row).setAttribute('aria-pressed', 'false');
  selected = null;
  const range = +qrange.value;
  quiz = { range, i: 0, score: 0, tries: 0, ans: null, type: null, locked: false, last: 0, fb: '' };
  tiles.forEach(t => t.classList.toggle('out', +t.dataset.n > range));
  nextQ();
}
function endQuiz() {
  clearTimeout(qTimer);
  quiz = null;
  setHide([]); clearMarks();
  tiles.forEach(t => t.classList.remove('out'));
  quizBtn.setAttribute('aria-pressed', 'false');
  qrangeWrap.hidden = true;
  showHint(); applyFit();
}
function nextQ() {
  clearMarks();
  if (quiz.i >= TOTAL_Q) { renderQuiz(true); setHide([]); return; }
  const pool = D.filter(e => e[0] <= quiz.range && e[0] !== quiz.last);
  const e = pool[Math.floor(Math.random() * pool.length)];
  const types = ['name', 'sym', 'num'];
  if (quizUse(e)) types.push('use', 'use');
  quiz.type = types[Math.floor(Math.random() * types.length)];
  quiz.ans = e[0]; quiz.last = e[0]; quiz.tries = 0; quiz.locked = false; quiz.fb = '';
  setHide({ name: ['k'], sym: ['s'], num: ['n'], use: ['k', 's'] }[quiz.type]);
  renderQuiz(false);
}
function questionHTML() {
  const e = D[quiz.ans - 1];
  switch (quiz.type) {
    case 'name': return `<b>${e[2]}</b> 원소를 찾아 클릭하세요`;
    case 'sym': return `기호 <b>${e[1]}</b> 의 원소를 찾아 클릭하세요`;
    case 'num': return `원자번호 <b>${e[0]}번</b> 원소를 찾아 클릭하세요`;
    default: return `“${USES[e[0] - 1].replaceAll(e[2], '○')}” <br>이런 용도의 원소는?`;
  }
}
function renderQuiz(finished) {
  if (finished) {
    panel.innerHTML = `<div class="qbox"><div class="qh">퀴즈 결과 (첫 시도 정답 기준)</div>
      <div class="qq"><b>${quiz.score}</b> / ${TOTAL_Q}</div>
      <div class="qb"><button class="btn" id="qAgain" type="button">다시 하기</button><button class="btn" id="qEnd" type="button">종료</button></div></div>`;
    document.getElementById('qAgain').onclick = startQuiz;
    document.getElementById('qEnd').onclick = endQuiz;
    return;
  }
  panel.innerHTML = `<div class="qbox"><div class="qh">문제 ${quiz.i + 1} / ${TOTAL_Q} · 점수 ${quiz.score}</div>
    <div class="qq">${questionHTML()}</div><div class="qf">${quiz.fb}</div>
    <div class="qb"><button class="btn" id="qSkip" type="button">건너뛰기</button><button class="btn" id="qEnd" type="button">종료</button></div></div>`;
  document.getElementById('qSkip').onclick = () => reveal('건너뜀');
  document.getElementById('qEnd').onclick = endQuiz;
}
function reveal(msg) {
  if (quiz.locked) return;
  const e = D[quiz.ans - 1];
  quiz.locked = true; quiz.i++;
  setHide([]);
  tiles.get(place(e[0]).col + ',' + place(e[0]).row).classList.add('right');
  quiz.fb = `${msg} — ${e[2]} (${e[1]}, ${e[0]}번)`;
  renderQuiz(false);
  panel.querySelector('.qh').textContent = `문제 ${Math.min(quiz.i, TOTAL_Q)} / ${TOTAL_Q} · 점수 ${quiz.score}`;
  qTimer = setTimeout(nextQ, 1500);
}
function answer(n) {
  if (quiz.locked) return;
  const t = tiles.get(place(n).col + ',' + place(n).row);
  if (n === quiz.ans) {
    if (quiz.tries === 0) quiz.score++;
    reveal('정답!');
    return;
  }
  quiz.tries++;
  t.classList.add('wrong');
  setTimeout(() => t.classList.remove('wrong'), 600);
  if (quiz.tries >= 3) { reveal('3번 틀려서 정답 공개'); return; }
  quiz.fb = `아니에요. 다시 찾아보세요 (${quiz.tries}/3)`;
  panel.querySelector('.qf').textContent = quiz.fb;
}
quizBtn.addEventListener('click', () => {
  if (quiz) { endQuiz(); return; }
  quizBtn.setAttribute('aria-pressed', 'true');
  qrangeWrap.hidden = false;
  startQuiz(); applyFit();
});
qrange.addEventListener('change', () => { if (quiz) startQuiz(); });

// 테마 전환 (프로젝터용)
const root = document.documentElement;
document.getElementById('theme').addEventListener('click', () => {
  const dark = root.dataset.theme
    ? root.dataset.theme === 'dark'
    : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark';
});
</script>
